name: fix-consistent-jpg
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode and replace consistent.jpg
        run: |
          set -euo pipefail
          cat tmp/consistent-b64/part*.txt | base64 -d > public/avatars/consistent.jpg
          python3 - <<'PY'
          from pathlib import Path
          p = Path("public/avatars/consistent.jpg")
          data = p.read_bytes()
          assert data[:3] == b"\xff\xd8\xff", data[:8]
          assert len(data) == 70346, len(data)
          print("ok", len(data), data[:3].hex())
          PY
          rm -rf tmp/consistent-b64
          rm -f .github/workflows/fix-consistent-jpg.yml
          git config user.name "pdroid31-grok"
          git config user.email "328909095+pdroid31-grok@users.noreply.github.com"
          git add -A
          git status
          git commit -m "Replace consistent.jpg with 640x640 JPEG"
          git push origin HEAD:main
